name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量说清楚「要解决什么问题」，而不只是「加一个按钮」。
        这个项目刻意保持简单：运行时零依赖、无前端框架、无构建步骤，方案越轻越好。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 现在的流程哪里别扭、慢、容易出错？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么改
      description: 描述期望的交互；有草图或参考工具也可以写
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 提示词质量 / 模板
        - 界面与交互
        - 保存库 / 历史记录
        - 设置与接口
        - 打包 / 发布
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过已有 issue，没有重复
          required: true

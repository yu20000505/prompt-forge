name: Release

# 打一个 v* 标签就会自动打包两种产物并发布到 Releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sanity check
        run: |
          node tests/check-ids.mjs
          node tests/check-prompts.mjs
          node tests/check-themes.mjs

      - name: Build single-file exe (Node SEA)
        run: node build/build-exe.mjs

      - name: Build desktop app (Electron)
        run: node build/build-desktop.mjs

      # 仓库里配置了签名证书就自动签名；没配置就跳过，产物仍可正常使用
      - name: Check signing certificate
        id: signcheck
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          if ($env:WINDOWS_PFX_BASE64) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
          }

      - name: Sign binaries (optional)
        if: steps.signcheck.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'promptforge-sign.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          try {
            node build/sign.mjs --pfx $pfx --password $env:WINDOWS_PFX_PASSWORD release/PromptForge.exe release-desktop/PromptForge-Desktop.exe
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            release/PromptForge.exe
            release-desktop/PromptForge-Desktop.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PromptForge.exe
            release-desktop/PromptForge-Desktop.exe
          generate_release_notes: true
          body: |
            ## Prompt Forge ${{ github.ref_name }}

            **一句话进，可出图的提示词出来。**

            ### 2.0 亮点

            - **结果可手改**：正向、负向、解读、参数、角色和细分标签都能直接编辑，标「已手改」，也能恢复模型原版。
            - **导入改写**：粘贴现成提示词，按当前风格重写，补负面词、中文解读和参数。
            - **统一历史**：提示词 / 角色 / 细分都自动记录，可筛选、搜索、收藏置顶、点一条恢复。
            - **七类一键生成 + 拼装板**：一次跑完七类标签，自动去重拼成可直接粘贴的 tag 串。
            - **保存库升级**：全文检索、高亮、收藏、排序、批量删除，以及不含 Key 的 JSON 备份/导入。
            - **更稳的接口**：429/5xx/网络失败自动退避重试；max_tokens、超时、top_p、流式、JSON 模式可调，截断有提示。
            - **中英双语**：右上角一键切换中文 / English。

            ### 下载哪个？

            | 文件 | 说明 |
            | --- | --- |
            | `PromptForge-Desktop.exe` | **推荐**。独立窗口的桌面版，不开浏览器、没有命令行窗口。 |
            | `PromptForge.exe` | 单文件命令行版，启动后自动用系统浏览器打开。 |

            两个都不需要安装 Node.js。发布产物默认未签名；维护者配置证书后会自动签名。
            若 Windows 提示「未知发布者」，点「更多信息 → 仍要运行」即可。

            数据保存在 `%APPDATA%\PromptForge`（`config.json`、`saved/`）。
            完整变更见仓库根目录的 `CHANGELOG.md`。
